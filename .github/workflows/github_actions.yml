name: ATmega328P Temperature Sensor & Calibration Controller
run-name: ${{ github.actor }} is running GitHub Actions 🚀
on: [push]
jobs:
  checkout_repository:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."
      - name: Install libraries and tools for AVR development (RISC architecture)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc avrdude make python3
      - name: Build debuge version of the project
        run: |
          make clean
          make all
          make test
      - name: Build release version of the project
        run: |
          make clean
          make release=1
